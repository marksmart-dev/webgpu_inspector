name: Deploy to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v1.0.2)'
        required: true
        type: string

jobs:
  deploy:
    name: Publish to Chrome Web Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build extensions
        run: npm run build

      - name: Package Chrome extension
        run: |
          cd extensions/chrome
          zip -r ../../webgpu-inspector-chrome.zip . -x "*.map"

      # Requires the following secrets to be set in repository settings:
      #   CHROME_CLIENT_ID     - OAuth client ID from Google Cloud Console
      #   CHROME_CLIENT_SECRET - OAuth client secret
      #   CHROME_REFRESH_TOKEN - OAuth refresh token (obtained via OAuth flow)
      #   CHROME_EXTENSION_ID  - Extension ID from Chrome Web Store
      - name: Publish to Chrome Web Store
        if: ${{ secrets.CHROME_CLIENT_ID != '' }}
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: webgpu-inspector-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Skip publish (secrets not configured)
        if: ${{ secrets.CHROME_CLIENT_ID == '' }}
        run: |
          echo "Chrome Web Store secrets not configured. Skipping publish."
          echo "To enable deployment, add these secrets in GitHub repository settings:"
          echo "  - CHROME_CLIENT_ID"
          echo "  - CHROME_CLIENT_SECRET"
          echo "  - CHROME_REFRESH_TOKEN"
          echo "  - CHROME_EXTENSION_ID"
